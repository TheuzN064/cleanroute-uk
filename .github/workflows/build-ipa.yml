name: Build Unsigned iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Configure Global Node Environment for Xcode
        run: |
          NODE_PATH=$(which node)
          NPM_PATH=$(which npm)
          NPX_PATH=$(which npx)
          echo "Node resolved to: $NODE_PATH"
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node || true
          sudo ln -sf "$NPM_PATH" /usr/local/bin/npm || true
          sudo ln -sf "$NPX_PATH" /usr/local/bin/npx || true
          echo "NODE_BINARY=$NODE_PATH" >> $GITHUB_ENV

      - name: 5. Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 6. Prebuild iOS Project and Apply Compatibility Patches
        run: |
          # 1. Patch dependencies before prebuild/install
          node scripts/patch-ios.js

          # 2. Generate native iOS project
          npx expo prebuild --platform ios --clean --no-install

          # 3. Patch generated Podfile and Xcode project settings
          node scripts/patch-ios.js

          # 4. Install CocoaPods
          cd ios
          pod install

      - name: 7. Pre-build ExpoModulesJSI XCFramework
        run: |
          chmod +x node_modules/expo-modules-jsi/apple/scripts/*.sh || true
          cd node_modules/expo-modules-jsi/apple
          export PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods"
          export PLATFORM_NAME=iphoneos
          ./scripts/build-xcframework.sh || echo "Pre-build step finished"

      - name: 8. Build and Package Unsigned IPA
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"

          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "========================================="
              echo "CRITICAL: xcodebuild compilation failed!"
              echo "Extracting errors from xcodebuild.log:"
              echo "========================================="
              grep -C 4 -E "(error:|FAILED:|\*\* BUILD FAILED \*\*)" xcodebuild.log | tail -n 150
              exit 1
            }

          # Verify and locate the built .app bundle
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate built .app bundle in build/Build/Products/Release-iphoneos"
            ls -la build/Build/Products/Release-iphoneos || true
            exit 1
          fi
          echo "Found compiled app bundle: $APP_PATH"

          # Package into standard unsigned IPA for Sideloadly
          rm -rf Payload CleanRouteUK.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CleanRouteUK.ipa Payload
          echo "IPA packaged successfully: $(ls -lh CleanRouteUK.ipa)"

      - name: 9. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanRouteUK.ipa
          path: ios/CleanRouteUK.ipa
          retention-days: 14
