name: Build Unsigned iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Generate Native iOS Project and Patch Podfile
        run: |
          npx expo prebuild --platform ios --clean --no-install

          # Patch Podfile to disable user script sandboxing for Xcode 16 CocoaPods scripts
          ruby -e '
          podfile = File.read("ios/Podfile")
          patch = %Q{
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"
                end
              end
          }
          if podfile.include?("post_install do |installer|")
            podfile.sub!("post_install do |installer|", "post_install do |installer|\n" + patch)
            File.write("ios/Podfile", podfile)
            puts "Successfully patched Podfile with ENABLE_USER_SCRIPT_SANDBOXING=NO"
          end
          '

          cd ios
          pod install

      - name: 6. Pre-build ExpoModulesJSI XCFramework
        run: |
          chmod +x node_modules/expo-modules-jsi/apple/scripts/*.sh || true
          cd node_modules/expo-modules-jsi/apple
          export PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods"
          export PLATFORM_NAME=iphoneos
          ./scripts/build-xcframework.sh || echo "Pre-build step finished"

      - name: 7. Build and Package Unsigned IPA
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r CleanRouteUK.ipa Payload
          echo "IPA created successfully at ios/CleanRouteUK.ipa"

      - name: 8. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanRouteUK.ipa
          path: ios/CleanRouteUK.ipa
          retention-days: 14
